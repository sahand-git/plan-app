name: Build Android APK and Google Play AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Create Release Signing Keystore
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias planapp \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass planapp123 \
            -keypass planapp123 \
            -dname "CN=Sahand, OU=Mobile, O=PlanApp, L=City, ST=State, C=US"

      - name: Build Android APK (Direct Phone Installation)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Android App Bundle (Google Play Store AAB)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Prepare Release Artifacts
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk plan-app.apk
          cp android/app/build/outputs/bundle/release/app-release.aab plan-app.aab
          ls -lh plan-app.apk plan-app.aab release.keystore

      - name: Upload Artifacts to Run
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: |
            plan-app.apk
            plan-app.aab
            release.keystore

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-v1.0.0
          name: "Plan App for Android (APK + Google Play AAB)"
          body: |
            # 📱 Plan App — Android Release v1.0.0

            ### ⬇️ Download Links
            - **[📱 Download APK (for direct phone install)](https://github.com/sahand-git/plan-app/releases/download/android-v1.0.0/plan-app.apk)**
              Download this `.apk` directly onto your Android phone to install and use Plan App natively.
            
            - **[🚀 Download AAB (for Google Play Console)](https://github.com/sahand-git/plan-app/releases/download/android-v1.0.0/plan-app.aab)**
              Upload this `.aab` (Android App Bundle) directly to [Google Play Console](https://play.google.com/console) to publish on the Google Play Store.

            ---

            ### 🔑 Release Keystore Information
            If you ever need to sign future updates for Google Play:
            - **Keystore file**: Included as `release.keystore`
            - **Alias**: `planapp`
            - **Store password**: `planapp123`
            - **Key password**: `planapp123`
          files: |
            plan-app.apk
            plan-app.aab
            release.keystore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
