name: Build Android APK and Google Play AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Create Release Signing Keystore
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias planapp \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass planapp123 \
            -keypass planapp123 \
            -dname "CN=Sahand, OU=Mobile, O=PlanApp, L=City, ST=State, C=US"

      - name: Build Android APK (Direct Phone Installation)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Android App Bundle (Google Play Store AAB)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Prepare Release Artifacts
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk the-tree-planner.apk
          cp android/app/build/outputs/apk/release/app-release.apk plan-app.apk
          cp android/app/build/outputs/bundle/release/app-release.aab the-tree-planner.aab
          cp android/app/build/outputs/bundle/release/app-release.aab plan-app.aab
          ls -lh the-tree-planner.apk the-tree-planner.aab plan-app.apk plan-app.aab release.keystore

      - name: Upload Artifacts to Run
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: |
            the-tree-planner.apk
            the-tree-planner.aab
            plan-app.apk
            plan-app.aab
            release.keystore

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "The Tree Planner — Android Release v1.0.0 (APK + Google Play AAB)"
          make_latest: true
          body: |
            # 🌿 The Tree Planner — Mobile Release v1.0.0

            A calm, minimalist mobile daily planner and habit tracker for iOS and Android.

            ### ⬇️ Direct Download Links
            - **[📱 Download The Tree Planner APK (Direct Phone Install)](https://github.com/sahand-git/plan-app/releases/download/v1.0.0/the-tree-planner.apk)**
              Download this `.apk` file directly onto your Android phone to install and run **The Tree Planner** natively.
            
            - **[📱 Alternative APK Link (plan-app.apk)](https://github.com/sahand-git/plan-app/releases/download/v1.0.0/plan-app.apk)**
            
            - **[🚀 Download AAB (Google Play Store Bundle)](https://github.com/sahand-git/plan-app/releases/download/v1.0.0/the-tree-planner.aab)**
              Upload this `.aab` file directly to the [Google Play Console](https://play.google.com/console) to publish on the Play Store.

            ---

            ### 🔑 Release Keystore Information
            - **Keystore file**: Included as `release.keystore`
            - **Alias**: `planapp`
            - **Store password**: `planapp123`
            - **Key password**: `planapp123`
          files: |
            the-tree-planner.apk
            the-tree-planner.aab
            plan-app.apk
            plan-app.aab
            release.keystore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
